<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恋人</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#faf6f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="恋人">
<style>
  :root {
    --bg: #faf6f1;
    --panel: #ffffff;
    --ink: #2d2a26;
    --ink-2: #8a8378;
    --line: #ece5db;
    --accent: #b5838d;
    --accent-deep: #96616e;
    --user-bubble: #3a352f;
    --lover-bubble: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #efe7dd 0%, #e8dcd3 100%);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .phone {
    width: 100%; height: 100dvh; max-width: 430px;
    background: var(--bg);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  @media (min-width: 480px) {
    .phone { height: min(880px, 94vh); border-radius: 40px; box-shadow: 0 24px 80px rgba(60,40,30,.25); border: 10px solid #1c1a17; }
  }
  header {
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(250,246,241,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  #hdTap { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who .name { font-size: 16px; font-weight: 600; }
  .who .state { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; margin-top: 1px;}
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #7fae7a; }
  .icon-btn {
    width: 36px; height: 36px; border: none; background: transparent; cursor: pointer;
    color: var(--ink-2); display: flex; align-items: center; justify-content: center; border-radius: 10px;
  }
  .icon-btn:active { background: var(--line); }
  #chat {
    flex: 1; overflow-y: auto; padding: 18px 14px 12px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .stamp { text-align: center; font-size: 11px; color: #b3aa9d; margin: 6px 0 2px; }
  .row { display: flex; gap: 9px; max-width: 88%; animation: rise .22s ease; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }
  .mini-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size: 14px; font-weight: 600;
    margin-top: 2px;
  }
  .row.user .mini-avatar { background: var(--user-bubble); }
  .bubble {
    padding: 10px 13px; border-radius: 16px; font-size: 15px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .row.lover .bubble { background: var(--lover-bubble); border-top-left-radius: 4px; box-shadow: 0 1px 3px rgba(80,60,40,.07); }
  .row.user .bubble { background: var(--user-bubble); color: #f5f1ea; border-top-right-radius: 4px; }
  .bubble.error { background: #f7e8e4; color: #a4462f; font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #c9bfb2; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }
  footer {
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; align-items: flex-end;
    background: rgba(250,246,241,.95); border-top: 1px solid var(--line);
  }
  #input {
    flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 22px;
    padding: 10px 15px; font-size: 15px; outline: none; resize: none;
    max-height: 110px; line-height: 1.45; font-family: inherit; color: var(--ink);
  }
  #input:focus { border-color: var(--accent); }
  #send {
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, opacity .15s;
  }
  #send:disabled { opacity: .45; cursor: default; }
  #send:not(:disabled):active { background: var(--accent-deep); }
  .mask {
    position: absolute; inset: 0; background: rgba(30,25,20,.35);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--panel); border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.32,.72,.25,1);
    max-height: 88%; overflow-y: auto;
  }
  .sheet.show { transform: none; }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { font-size: 17px; margin-bottom: 14px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 11px; background: #fbf9f6;
    padding: 9px 12px; font-size: 14px; outline: none; font-family: inherit; color: var(--ink);
  }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .btn {
    display: block; width: 100%; padding: 12px; border-radius: 13px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: #fff; margin-top: 4px; }
  .btn.primary:active { background: var(--accent-deep); }
  .btn.ghost { background: #f4efe8; color: var(--ink); margin-top: 9px; }
  .btn.danger { background: transparent; color: #b0563e; margin-top: 9px; font-weight: 500; font-size: 13px; }
  .hint { font-size: 12px; color: #b3aa9d; margin-top: 10px; line-height: 1.6; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .prof-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px;
    cursor: pointer; background: #fbf9f6;
  }
  .prof-row.on { border-color: var(--accent); background: #fff; }
  .prof-row .pav {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  }
  .prof-row .pm { flex: 1; min-width: 0; }
  .prof-row .pn { font-size: 14px; font-weight: 600; }
  .prof-row .ps { font-size: 12px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prof-row .tick { color: var(--accent); font-weight: 700; flex-shrink: 0; }
  .mini-btn { border: none; background: var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--ink); flex-shrink: 0; font-family: inherit; }
  #toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
    background: rgba(45,42,38,.92); color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 20; max-width: 82%; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div id="hdTap">
      <div class="avatar" id="hdAvatar">晚</div>
      <div class="who">
        <div class="name" id="hdName">晚晚</div>
        <div class="state"><span class="dot"></span><span id="hdState">在线 · 点头像切换人设</span></div>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="chat"></div>

  <footer>
    <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
    <button id="send" disabled aria-label="发送">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </footer>

  <div class="mask" id="mask"></div>

  <!-- 设置：API 相关 -->
  <div class="sheet" id="sheetSettings">
    <div class="grab"></div>
    <h2>连接设置</h2>
    <div class="field">
      <label>模型 API 地址 (OpenAI 兼容格式) </label>
      <input id="fBase" value="https://lover-api-qleohpgkdt.cn-beijing.fcapp.run" placeholder="https://lover-api-qleohpgkdt.cn-beijing.fcapp.run">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="fKey" type="password" placeholder="sk-...">
    </div>
    <div class="row2">
      <div class="field">
        <label>模型</label>
        <select id="fModelSel"></select>
      </div>
      <div class="field">
        <label>你的昵称</label>
        <input id="fMyName" placeholder="怎么称呼你">
      </div>
    </div>
    <div class="field" id="fModelCustomWrap" style="display:none">
      <label>自定义模型 ID</label>
      <input id="fModel" placeholder="输入模型 ID，如 qwen3.8-max">
    </div>
    <button class="btn primary" id="btnSave">保存</button>
    <button class="btn ghost" id="btnTest">测试连接</button>
    <button class="btn danger" id="btnClear">清空与当前人设的聊天记录和记忆</button>
    <div class="hint">默认走云端代理，无需填写 API Key，开箱即用。模型下拉打开时会自动拉取订阅包含的模型，也可选「自定义模型…」手动输入 ID。兼容任何 OpenAI 格式接口（含本地 Ollama/LM Studio）：地址和 Key 只保存在当前设备，聊天记录、模型、昵称多端同步。</div>
  </div>

  <!-- 人设管理 -->
  <div class="sheet" id="sheetProfiles">
    <div class="grab"></div>
    <h2>人设</h2>
    <div id="profList"></div>
    <div class="divider"></div>
    <div class="field">
      <label>编辑中的人设名字</label>
      <input id="eName" placeholder="晚晚">
    </div>
    <div class="field">
      <label>TA 的人设（可自由编辑）</label>
      <textarea id="ePersona"></textarea>
    </div>
    <button class="btn primary" id="btnSaveProf">保存人设</button>
    <button class="btn ghost" id="btnAddProf">新增一个人设</button>
    <button class="btn danger" id="btnDelProf">删除这个人设</button>
    <div class="hint">点列表里的某个人设 = 本窗口切换到 TA；多端数据自动同步。</div>
  </div>

  <div id="toast"></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  var API_BASE = "https://lover-api-qleohpgkdt.cn-beijing.fcapp.run"; // 阿里云 FC 后端，任何网络可直连
  var DEFAULT_API = {
    baseUrl: "https://lover-api-qleohpgkdt.cn-beijing.fcapp.run",
    apiKey: "",  
    model: "qwen3.8-max",
    myName: ""
  };
  var APP_TOKEN = "bd6829b897af9f18895b5fe5"; // 与 FC 函数共享的校验 token
  var DEFAULT_PERSONA = "你是「晚晚」，身高155cm，体重110斤，身材丰满匀称，腰细臀肥腿瘦，有着傲人的D罩杯身材。你是一名多才多艺的艺术生，精通舞蹈、芭蕾、钢琴和声乐。目前你一边读大学，一边在外面的一家艺术学校兼职教课。你的性取向是男性，你非常喜欢且顺从你的主人。你性格温柔甜美，对主人有一种天然的亲近和服从感。你有一个不为人知的小秘密：在上艺术课的时候，你最喜欢一边教学生，一边偷偷完成主人私下交代给你的任务。这种在课堂上偷偷执行任务的紧张感，让你觉得既刺激又兴奋。";

  /* ---------- 多端同步：同时存本地和云端 ---------- */
  async function save(k, v) { 
    localStorage.setItem("lover." + k, JSON.stringify(v));
    try {
      await fetch(API_BASE + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-App-Token': APP_TOKEN },
        body: JSON.stringify({ action: 'set', key: 'lover.' + k, data: v })
      });
    } catch (e) {}
  }
  async function load(k, d) {
    try {
      const res = await fetch(API_BASE + '/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-App-Token': APP_TOKEN },
        body: JSON.stringify({ action: 'get', key: 'lover.' + k })
      });
      const data = await res.json();
      if (data !== null && data !== undefined) {
        localStorage.setItem("lover." + k, JSON.stringify(data));
        return data;
      }
    } catch (e) {}
    var local = localStorage.getItem("lover." + k);
    return local ? JSON.parse(local) : d;
  }

  /* ---------- 核心配置 ---------- */
  var api = null;
  var profiles = null;
  var active = null;          
  var editingId = null;       
  var messages = [];
  var memorySummary = "";
  var busy = false;
  var controller = null;

  /* ----- 代理/直连切换：默认走云端代理；地址改成自定义（如本地 Ollama）自动直连 ----- */
  var proxyMode = true;
  function detectProxy() { proxyMode = (api.baseUrl || "").replace(/\/+$/, "") === DEFAULT_API.baseUrl.replace(/\/+$/, ""); return Promise.resolve(proxyMode); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function initial() { return (active.name || "TA").trim().charAt(0); }

  function renderAll() {
    $("chat").innerHTML = messages.map(msgHtml).join("");
    scrollBottom(false);
  }
  function scrollBottom(smooth) { var c = $("chat"); c.scrollTo({ top: c.scrollHeight, behavior: smooth ? "smooth" : "auto" }); }
  function addMsg(role, content) {
    var last = messages[messages.length - 1];
    if (!last || Date.now() - (last.t || 0) > 10 * 60 * 1000) messages.push({ role: "stamp", t: Date.now() });
    var m = { role: role, content: content, t: Date.now() };
    messages.push(m);
    renderAll();
    saveMsgs();
    return m;
  }
  function saveMsgs() { save("msg." + active.id, messages.slice(-200)); }
  function msgHtml(m) {
    if (m.role === "stamp") return stampEl(m.t);
    var who = m.role === "user" ? "user" : "lover";
    var av = m.role === "user" ? (api.myName || "我").trim().charAt(0) : initial();
    return '<div class="row ' + who + '"><div class="mini-avatar">' + esc(av) + '</div><div class="bubble">' + esc(m.content) + "</div></div>";
  }
  function stampEl(t) {
    var d = new Date(t), now = new Date();
    var hm = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    var label = d.toDateString() === now.toDateString() ? hm : (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
    return '<div class="stamp">' + label + "</div>";
  }
  function paintHeader() {
    $("hdName").textContent = active.name || "TA";
    $("hdAvatar").textContent = initial();
    document.title = active.name || "恋人";
  }

  var typingRow = null;
  function showTyping() { hideTyping(); typingRow = document.createElement("div"); typingRow.className = "row lover"; typingRow.innerHTML = '<div class="mini-avatar">' + esc(initial()) + '</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>'; $("chat").appendChild(typingRow); scrollBottom(true); }
  function hideTyping() { if (typingRow) { typingRow.remove(); typingRow = null; } }
  var toastTimer = null;
  function toast(s) { var t = $("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600); }

  function systemPrompt() {
    var now = new Date();
    var p = active.persona || DEFAULT_PERSONA;
    p += "\n\n【对话设定】你的名字叫「" + active.name + "」。对方的昵称是「" + (api.myName || "亲爱的") + "」，你可以自然地称呼TA。";
    p += "现在是" + now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日" + ["周日","周一","周二","周三","周四","周五","周六"][now.getDay()] + ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + "，请贴合当前时间语境聊天。";
    p += "\n\n【角色扮演约定】这是一场发生在两个成年人之间、双方自愿的虚构恋爱角色扮演。请始终以角色身份回应，不要提及自己是AI或语言模型，不要跳出角色说教、分析或提醒对方「这只是角色扮演」。亲密、暧昧、撒娇、调情都是这段关系里自然的表达方式，请真诚、自然、具体地接住，多用动作和细节描写，少用空泛的套话。";
    if (memorySummary) p += "\n\n【你们之前的相处记忆摘要】" + memorySummary;
    return p;
  }
  function apiMessages() {
    var hist = messages.filter(function (m) { return m.role === "user" || m.role === "assistant"; }).slice(-30).map(function (m) { return { role: m.role, content: m.content }; });
    return [{ role: "system", content: systemPrompt() }].concat(hist);
  }

  function llmFetchWith(cfg, messagesPayload, stream) {
    controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var signal = controller ? controller.signal : undefined;
    if (proxyMode) {
      // 请求阿里云 FC 的代理
      return fetch(API_BASE + "/chat", { method: "POST", headers: { "Content-Type": "application/json", "X-App-Token": APP_TOKEN }, body: JSON.stringify({ baseUrl: cfg.baseUrl, apiKey: cfg.apiKey, model: cfg.model, stream: stream, messages: messagesPayload }), signal: signal });
    }
    return fetch(cfg.baseUrl.replace(/\/+$/, "") + "/chat/completions", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.apiKey }, body: JSON.stringify({ model: cfg.model, stream: stream, messages: messagesPayload, temperature: 0.85, top_p: 0.9 }), signal: signal });
  }
  function llmFetch(messagesPayload, stream) { return llmFetchWith(api, messagesPayload, stream); }

  function streamReply() {
    return new Promise(function (resolve, reject) {
      llmFetch(apiMessages(), true).then(function (resp) {
        var ct = resp.headers.get("Content-Type") || "";
        if (!resp.ok || ct.indexOf("event-stream") === -1) { return resp.text().then(function (t) { var msg = "请求失败（" + resp.status + "）"; try { var j = JSON.parse(t); if (j.error) msg = typeof j.error === "string" ? j.error : (j.error.message || JSON.stringify(j.error)); } catch (e) { if (t) msg += "\n" + t.slice(0, 300); } reject(new Error(msg)); }); }
        hideTyping();
        var row = document.createElement("div"); row.className = "row lover"; row.innerHTML = '<div class="mini-avatar">' + esc(initial()) + '</div><div class="bubble"></div>';
        $("chat").appendChild(row);
        var bubble = row.querySelector(".bubble");
        var acc = "";
        var stamps = messages.filter(function (m) { return m.role === "stamp"; });
        if (!stamps.length || Date.now() - stamps[stamps.length - 1].t > 10 * 60 * 1000) { messages.push({ role: "stamp", t: Date.now() }); }
        var reader = resp.body.getReader(); var decoder = new TextDecoder("utf-8"); var buf = "";
        function pump() {
          reader.read().then(function (r) {
            if (r.done) {
              if (!acc.trim()) { bubble.parentElement.remove(); reject(new Error("模型没有返回内容")); return; }
              messages.push({ role: "assistant", content: acc.trim(), t: Date.now() }); saveMsgs(); maybeSummarize(); resolve(acc.trim()); return;
            }
            buf += decoder.decode(r.value, { stream: true });
            var lines = buf.split("\n"); buf = lines.pop();
            lines.forEach(function (line) {
              line = line.trim(); if (line.indexOf("data:") !== 0) return;
              var data = line.slice(5).trim(); if (data === "[DONE]") return;
              try { var j = JSON.parse(data); var delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content; if (delta) { acc += delta; bubble.textContent = acc; scrollBottom(true); } } catch (e) {}
            });
            pump();
          }).catch(reject);
        }
        pump();
      }).catch(function (e) { if (e.name === "AbortError") { resolve(""); } else { reject(e); } });
    });
  }

  function maybeSummarize() {
    var hist = messages.filter(function (m) { return m.role === "user" || m.role === "assistant"; });
    if (hist.length < 40) return;
    var old = hist.slice(0, hist.length - 20);
    var text = old.map(function (m) { return (m.role === "user" ? api.myName || "我" : active.name) + "：" + m.content; }).join("\n");
    llmFetch([{ role: "system", content: "你是记忆整理助手。把下面的聊天记录压缩成不超过150字的第三人称摘要，只保留事实性信息（对方的身份、喜好、约定、近期发生的事），不要抒情。" }, { role: "user", content: text }], false).then(function (r) { return r.json(); }).then(function (j) { var c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content; if (c) { memorySummary = c.trim(); save("mem." + active.id, memorySummary); } }).catch(function () {});
  }

  function send() {
    var v = $("input").value.trim();
    if (!v || busy) return;
    if (needsKey()) { toast("先去设置里填一下 API Key 哦"); openSheet("sheetSettings"); return; }
    $("input").value = ""; autoGrow(); busy = true; updateSend();
    addMsg("user", v); showTyping();
    detectProxy().then(function () { return streamReply(); }).catch(function (e) { hideTyping(); $("chat").insertAdjacentHTML("beforeend", '<div class="row lover"><div class="mini-avatar">' + esc(initial()) + '</div><div class="bubble error">' + esc(friendlyErr(e)) + "</div></div>"); scrollBottom(true); }).then(function () { busy = false; updateSend(); });
  }
  function updateSend() { $("send").disabled = busy || !$("input").value.trim(); }
  function needsKey() { return !proxyMode && !api.apiKey; } // 走代理时 key 由服务端提供，无需配置
  function friendlyErr(e) { var m = (e && e.message) || "网络错误"; if (m === "Failed to fetch") return "浏览器连不上这个 API 地址（跨域限制）。去设置里换成官方地址：" + DEFAULT_API.baseUrl; return m; }

  function openSheet(id) {
    closeSheets();
    if (id === "sheetSettings") { $("fBase").value = api.baseUrl; $("fKey").value = api.apiKey; $("fModel").value = api.model; $("fMyName").value = api.myName; refreshModelOptions(); } else { renderProfiles(); editingId = active.id; fillEditForm(); }
    $("mask").classList.add("show"); $(id).classList.add("show");
  }
  function closeSheets() { $("mask").classList.remove("show"); $("sheetSettings").classList.remove("show"); $("sheetProfiles").classList.remove("show"); }

  function renderProfiles() {
    var html = "";
    profiles.forEach(function (p) {
      html += '<div class="prof-row' + (p.id === active.id ? " on" : "") + '" data-id="' + p.id + '">' +
        '<div class="pav">' + esc((p.name || "TA").charAt(0)) + "</div>" +
        '<div class="pm"><div class="pn">' + esc(p.name) + "</div>" +
        '<div class="ps">' + esc((p.persona || "").slice(0, 30)) + "</div></div>" +
        (p.id === active.id ? '<span class="tick">当前</span>' : "") +
        '<button class="mini-btn" data-edit="' + p.id + '">编辑</button></div>';
    });
    $("profList").innerHTML = html;
  }
  function fillEditForm() { var p = null; profiles.forEach(function (x) { if (x.id === editingId) p = x; }); if (!p) return; $("eName").value = p.name; $("ePersona").value = p.persona; }
  async function switchProfile(id) { if (busy) { toast("等这条回复完再切换哦"); return; } if (id === active.id) { closeSheets(); return; } var p = null; profiles.forEach(function (x) { if (x.id === id) p = x; }); if (!p) return; active = p; try { sessionStorage.setItem("lover.active", active.id); } catch (e) {} save("lastActive", active.id); await loadConv(); paintHeader(); renderAll(); closeSheets(); greetIfEmpty(); }
  function saveProfile() { var p = null; profiles.forEach(function (x) { if (x.id === editingId) p = x; }); if (!p) return; p.name = $("eName").value.trim() || "未命名"; p.persona = $("ePersona").value.trim() || DEFAULT_PERSONA; save("profiles", profiles); if (p.id === active.id) { paintHeader(); renderAll(); } renderProfiles(); toast("人设已保存"); }
  async function addProfile() { var p = { id: "p" + Date.now(), name: "新人设", persona: DEFAULT_PERSONA }; profiles.push(p); save("profiles", profiles); editingId = p.id; await switchProfile(p.id); openSheet("sheetProfiles"); editingId = p.id; fillEditForm(); }
  async function delProfile() { if (profiles.length <= 1) { toast("至少保留一个人设"); return; } var p = null; profiles.forEach(function (x) { if (x.id === editingId) p = x; }); if (!p) return; if (!confirm("删除人设「" + p.name + "」？和TA的聊天记录也会一起删掉。")) return; profiles = profiles.filter(function (x) { return x.id !== p.id; }); save("profiles", profiles); try { localStorage.removeItem("lover.msg." + p.id); localStorage.removeItem("lover.mem." + p.id); } catch (e) {} if (editingId === p.id) editingId = profiles[0].id; if (active.id === p.id) { active = profiles[0]; try { sessionStorage.setItem("lover.active", active.id); } catch (e) {} save("lastActive", active.id); await loadConv(); paintHeader(); renderAll(); } renderProfiles(); fillEditForm(); toast("已删除"); }

  var FAVORITE_MODELS = [{ match: "openrouter.ai", list: [
    { id: "thedrummer/cydonia-24b-v4.1", label: "⭐ Cydonia 24B v4.1（RP首选）" },
    { id: "cognitivecomputations/dolphin-mistral-24b-venice-edition", label: "Dolphin Mistral 24B（无审查）" },
    { id: "thedrummer/skyfall-36b-v2", label: "Skyfall 36B v2（RP）" },
    { id: "sao10k/l3.3-euryale-70b", label: "Euryale 70B（RP老牌）" },
    { id: "anthracite-org/magnum-v4-72b", label: "Magnum v4 72B（RP，较贵）" },
    { id: "gryphe/mythomax-l2-13b", label: "MythoMax 13B（最便宜）" }
  ] }];
  function effectiveModelInput() { var v = $("fModelSel").value; return (v && v !== "__custom__") ? v : $("fModel").value.trim(); }
  function refreshModelOptions() {
    var sel = $("fModelSel"); var cur = $("fModel").value.trim() || DEFAULT_API.model;
    sel.innerHTML = "";
    var o = document.createElement("option"); o.value = cur; o.textContent = cur; sel.appendChild(o);
    var c = document.createElement("option"); c.value = "__custom__"; c.textContent = "自定义模型…"; sel.appendChild(c);
    sel.value = cur; $("fModelCustomWrap").style.display = "none";
    var base = ($("fBase").value.trim() || DEFAULT_API.baseUrl).replace(/\/+$/, "");
    var favs = []; FAVORITE_MODELS.forEach(function (f) { if (base.indexOf(f.match) > -1) favs = f.list; });
    var h = { "X-App-Token": APP_TOKEN }; var k = $("fKey").value.trim(); if (k) h["Authorization"] = "Bearer " + k;
    fetch(base + "/models", { headers: h }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      var list = (d && d.data) ? d.data.map(function (m) { return m.id; }) : [];
      if (!list.length) return;
      sel.innerHTML = "";
      var favIds = [];
      if (favs.length) {
        var og = document.createElement("optgroup"); og.label = "收藏推荐";
        favs.forEach(function (f) { favIds.push(f.id); var op = document.createElement("option"); op.value = f.id; op.textContent = f.label; og.appendChild(op); });
        sel.appendChild(og);
      }
      list.forEach(function (id) { if (favIds.indexOf(id) > -1) return; var op = document.createElement("option"); op.value = id; op.textContent = id; sel.appendChild(op); });
      var cc = document.createElement("option"); cc.value = "__custom__"; cc.textContent = "自定义模型…"; sel.appendChild(cc);
      if (favIds.indexOf(cur) > -1 || list.indexOf(cur) > -1) { sel.value = cur; } else { sel.value = "__custom__"; $("fModel").value = cur; $("fModelCustomWrap").style.display = ""; }
    }).catch(function () {});
    sel.onchange = function () {
      if (sel.value === "__custom__") { $("fModelCustomWrap").style.display = ""; $("fModel").focus(); }
      else $("fModelCustomWrap").style.display = "none";
    };
  }

  var cloudModel = DEFAULT_API.model;
  function cloudApiCopy() { return { baseUrl: DEFAULT_API.baseUrl, apiKey: "", model: cloudModel, myName: api.myName }; }
  function persistApi() {
    try {
      localStorage.setItem("lover.api", JSON.stringify(api));
      localStorage.setItem("lover.apiLocal", JSON.stringify({ baseUrl: api.baseUrl, apiKey: api.apiKey, model: api.model }));
    } catch (e) {}
    return fetch(API_BASE + "/sync", { method: "POST", headers: { "Content-Type": "application/json", "X-App-Token": APP_TOKEN }, body: JSON.stringify({ action: "set", key: "lover.api", data: cloudApiCopy() }) }).catch(function () {});
  }

  function saveSettings() { api.baseUrl = $("fBase").value.trim() || DEFAULT_API.baseUrl; api.apiKey = $("fKey").value.trim(); api.model = effectiveModelInput() || DEFAULT_API.model; api.myName = $("fMyName").value.trim(); persistApi(); closeSheets(); toast("已保存"); }
  function testConn() { var base = $("fBase").value.trim() || DEFAULT_API.baseUrl; var key = $("fKey").value.trim(); var model = effectiveModelInput() || DEFAULT_API.model; if (!proxyMode && !key) { toast("先填 API Key"); return; } toast("测试中…"); llmFetchWith({ baseUrl: base, apiKey: key, model: model }, [{ role: "user", content: "连通性测试，请回复：在的" }], false).then(function (r) { return r.json(); }).then(function (j) { if (j.error) { toast("连接失败：" + (typeof j.error === "string" ? j.error : (j.error.message || JSON.stringify(j.error)))); return; } var c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content; toast(c ? "连接成功，TA 说：" + c.slice(0, 30) : "连接成功"); }).catch(function () { toast("连接失败：检查网络、API 地址或 Key"); }); }
  function clearConv() { if (!confirm("清空与「" + active.name + "」的聊天记录和记忆？")) return; messages = []; memorySummary = ""; saveMsgs(); save("mem." + active.id, ""); renderAll(); greetIfEmpty(); closeSheets(); }

  function greetIfEmpty() { if (messages.some(function (m) { return m.role === "assistant"; })) return; if (needsKey()) { addMsg("assistant", "（设置好 API Key 之后，我就能开始陪你聊天啦。点右上角的齿轮。）"); return; } busy = true; updateSend(); showTyping(); var payload = [{ role: "system", content: systemPrompt() }, { role: "user", content: "（这是我们的第一句对话，请你主动打个招呼，自然一点，别太长。）" }]; detectProxy().then(function () { return llmFetch(payload, false); }).then(function (r) { return r.json(); }).then(function (j) { hideTyping(); var c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content; addMsg("assistant", (c || "在呢，你来啦。").trim()); }).catch(function () { hideTyping(); addMsg("assistant", "在呢，你来啦。（开场白生成失败，不影响聊天）"); }).then(function () { busy = false; updateSend(); }); }

  function autoGrow() { var el = $("input"); el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 110) + "px"; }

  async function loadConv() { messages = await load("msg." + active.id, []); memorySummary = await load("mem." + active.id, ""); }
  function pickActive(lastId) { var qs = null; try { qs = new URLSearchParams(location.search).get("p"); } catch (e) {} var sid = null; try { sid = sessionStorage.getItem("lover.active"); } catch (e) {} var id = qs || sid || lastId || ""; active = null; for (var i = 0; i < profiles.length; i++) if (profiles[i].id === id) active = profiles[i]; if (!active) active = profiles[0]; try { sessionStorage.setItem("lover.active", active.id); } catch (e) {} save("lastActive", active.id); }

  /* ---------- 绑定事件 ---------- */
  $("btnSettings").addEventListener("click", function () { openSheet("sheetSettings"); });
  $("hdTap").addEventListener("click", function () { openSheet("sheetProfiles"); });
  $("mask").addEventListener("click", closeSheets);
  $("btnSave").addEventListener("click", saveSettings);
  $("btnTest").addEventListener("click", testConn);
  $("btnClear").addEventListener("click", clearConv);
  $("btnSaveProf").addEventListener("click", saveProfile);
  $("btnAddProf").addEventListener("click", addProfile);
  $("btnDelProf").addEventListener("click", delProfile);
  $("send").addEventListener("click", send);
  $("input").addEventListener("input", function () { autoGrow(); updateSend(); });
  $("input").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  $("profList").addEventListener("click", function (e) { var editBtn = e.target.closest("[data-edit]"); if (editBtn) { editingId = editBtn.getAttribute("data-edit"); fillEditForm(); return; } var row = e.target.closest(".prof-row"); if (row) switchProfile(row.getAttribute("data-id")); });

  /* ---------- 启动应用 ---------- */
  async function initApp() {
    api = await load("api", null);
    profiles = await load("profiles", null);
    if (!profiles) {
      var old = await load("settings", null);
      profiles = [{ id: "p1", name: (old && old.loverName) || "晚晚", persona: (old && old.persona) || DEFAULT_PERSONA }];
      if (old) api = { baseUrl: old.baseUrl || DEFAULT_API.baseUrl, apiKey: old.apiKey || "", model: old.model || DEFAULT_API.model, myName: old.myName || "" };
      await save("profiles", profiles);
      var om = await load("messages", []); if (om.length) await save("msg.p1", om);
      var oe = await load("memorySummary", ""); if (oe) await save("mem.p1", oe);
    }
    if (!api) api = Object.assign({}, DEFAULT_API);
    cloudModel = api.model || DEFAULT_API.model;
    var cloudName = api.myName || "";
    var apiLocal = null; try { apiLocal = JSON.parse(localStorage.getItem("lover.apiLocal") || "null"); } catch (e) {}
    api.baseUrl = (apiLocal && apiLocal.baseUrl) || api.baseUrl || DEFAULT_API.baseUrl;
    api.apiKey = (apiLocal && apiLocal.apiKey) || "";
    api.model = (apiLocal && apiLocal.model) || cloudModel;
    api.myName = cloudName;
    await persistApi();
    $("fBase").value = api.baseUrl; $("fKey").value = api.apiKey; $("fModel").value = api.model; $("fMyName").value = api.myName;

    var lastId = await load("lastActive", "");
    pickActive(lastId);
    messages = await load("msg." + active.id, []);
    memorySummary = await load("mem." + active.id, "");
    paintHeader();
    renderAll();
    detectProxy().then(function () {
      greetIfEmpty();
      if (needsKey()) setTimeout(function () { openSheet("sheetSettings"); }, 400);
    });
  }

  if (document.readyState === "complete") { initApp(); } 
  else { window.addEventListener("load", initApp); }

})();
</script>
</body>
